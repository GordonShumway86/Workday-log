<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workday Log</title>
<style>
:root{--blue:#1769e0;--red:#b42318;--bg:#f2f4f7;--line:#d0d5dd;--text:#101828;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:700px;margin:auto;padding:16px 14px 45px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
button{border:0;border-radius:10px;background:#e7eefc;color:#124395;padding:12px 10px;font-weight:700;font-size:15px;min-height:44px}
button:active{opacity:.75}.primary{background:var(--blue);color:#fff}.end{background:var(--red);color:#fff}
.small{min-height:34px;padding:7px 9px;font-size:13px}.active{outline:3px solid #7eb0ff;background:#dbeafe}
.clock{text-align:center}.timer{font-size:14px;color:var(--muted)}
.paid{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.caption{font-size:12px;color:var(--muted);letter-spacing:.08em}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.lunch{margin-top:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.lunch label{color:var(--muted);font-size:14px}
.event{border-top:1px solid var(--line);padding:10px 0}
.event:first-child{border-top:0;padding-top:0}
.row{display:flex;gap:7px;align-items:center}
.name{font-weight:700;width:110px}.time{font-size:17px;font-weight:700;flex:1}
.note{display:block;margin:7px 0 0 117px;width:15ch;height:30px;line-height:20px;resize:none;overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:15px inherit}
.note:focus{width:min(40ch,100%);height:112px;white-space:normal;overflow:auto;outline:2px solid #8db7ff}
.hide{display:none!important}
.setting{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.historyDay{border-top:1px solid var(--line);padding:10px 0}
.historyDay:first-child{border-top:0}
.historyHead{display:flex;gap:8px;align-items:center}
.historyHead button:first-child{background:none;color:var(--text);padding:2px;text-align:left;flex:1}
.details{display:none;white-space:pre-wrap;font-size:14px;line-height:1.45;margin-top:8px}
.details.open{display:block}
@media(max-width:420px){.note{margin-left:0}.name{width:96px}}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Workday Log</h1>
  <button class="small" onclick="menu()">☰ Menu</button>
</div>

<div class="card hide" id="settings">
  <h2>Show or hide buttons</h2>
  <div id="toggles"></div>
</div>

<div class="card clock">
  <div class="timer" id="timer">Timer 00:00:00</div>
  <div class="paid" id="paid">00:00</div>
  <div class="caption">PAID TIME</div>
</div>

<div class="card">
  <div class="buttons">
    <button class="primary" id="start" onclick="start()">Start Day</button>
    <button class="end" id="end" onclick="press('end')">End Day</button>
    <button data-show="onsite" onclick="press('onsite')">Onsite</button>
    <button data-show="complete" onclick="press('complete')">Job Complete</button>
    <button data-show="stop" onclick="press('stop')">Stop</button>
    <button data-show="resume" onclick="press('resume')">Resume</button>
  </div>

  <div class="lunch" data-show="lunch">
    <label>Lunch deduction:</label>
    <button class="small" data-lunch="30" onclick="lunch(30)">30 min</button>
    <button class="small" data-lunch="60" onclick="lunch(60)">60 min</button>
    <button class="small" data-lunch="90" onclick="lunch(90)">90 min</button>
  </div>
</div>

<div class="card">
  <h2>Today</h2>
  <div id="today" style="margin-top:12px"></div>
</div>

<div class="card">
  <div class="top">
    <h2>History</h2>
    <button class="small" onclick="copyAll()">Copy full history</button>
  </div>
  <div id="history" style="margin-top:10px"></div>
</div>
</main>

<script>
const K="workday-log-v2";

const labels={
  start:"Start Day",
  onsite:"Onsite",
  complete:"Job Complete",
  stop:"Stop",
  resume:"Resume",
  lunch:"Lunch",
  end:"End Day"
};

let db=JSON.parse(
  localStorage.getItem(K) ||
  '{"days":[],"settings":{"onsite":true,"complete":true,"stop":true,"resume":true,"lunch":true}}'
);

const $=x=>document.querySelector(x);
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const now=()=>new Date().toISOString();
const active=()=>db.days.find(x=>!x.end);

const fmt=n=>{
  return String(Math.floor(n/60)).padStart(2,"0")+":"+
    String(Math.floor(n%60)).padStart(2,"0");
};

const stamp=x=>new Intl.DateTimeFormat(undefined,{
  month:"short",day:"numeric",year:"numeric",
  hour:"numeric",minute:"2-digit"
}).format(new Date(x));

const short=x=>new Intl.DateTimeFormat(undefined,{
  hour:"numeric",minute:"2-digit"
}).format(new Date(x));

function work(d){
  if(!d)return 0;

  let finish=new Date(d.end?.time||now());
  let m=(finish-new Date(d.start.time))/60000;

  if(d.stop){
    let out=new Date(d.stop.time);
    let back=new Date(d.resume?.time||finish);
    m-=Math.max(0,(back-out)/60000);
  }

  return Math.max(0,m-(d.lunch?.minutes||0));
}

function elapsed(d){
  if(!d)return 0;

  let m=(new Date()-new Date(d.start.time))/60000;

  if(d.stop&&!d.resume){
    m-=(new Date()-new Date(d.stop.time))/60000;
  }

  return Math.max(0,m);
}

function start(){
  if(active())return;

  db.days.unshift({
    start:{time:now(),note:""}
  });

  save();
  render();
}

function press(k){
  let d=active();

  if(!d){
    alert("Press Start Day first.");
    return;
  }

  if(d[k]&&!confirm(
    labels[k]+" has already been pressed. Overwrite its timestamp with the current time?"
  )){
    return;
  }

  d[k]={time:now(),note:d[k]?.note||""};
  save();
  render();
}

function lunch(n){
  let d=active();

  if(!d){
    alert("Press Start Day first.");
    return;
  }

  if(d.lunch&&!confirm(
    "Lunch is already set to "+d.lunch.minutes+" min. Overwrite it with "+n+" min?"
  )){
    return;
  }

  d.lunch={
    time:now(),
    minutes:n,
    note:d.lunch?.note||""
  };

  save();
  render();
}

function noteChange(k,v){
  let d=active();
  if(!d||!d[k])return;
  d[k].note=v;
  save();
}

function row(d,k){
  let e=d[k];
  if(!e)return "";

  let timeText=k==="lunch"?e.minutes+" min":short(e.time);

  return `
    <div class="event">
      <div class="row">
        <span class="name">${labels[k]}</span>
        <span class="time">${timeText}</span>
      </div>
      <textarea class="note" placeholder="note"
        oninput="noteChange('${k}',this.value)">${e.note||""}</textarea>
    </div>
  `;
}

function text(d){
  let lines=["start","onsite","complete","stop","resume","lunch","end"]
    .filter(k=>d[k])
    .map(k=>{
      let e=d[k];
      let val=k==="lunch"?e.minutes+" min":short(e.time);
      let line=labels[k]+": "+val;
      if(e.note)line+=" — "+e.note;
      return line;
    });

  let header=stamp(d.start.time)+" — "+(d.end?"Paid "+fmt(work(d)):"In progress");

  return header+"\n"+lines.join("\n");
}

function render(){
  let d=active();

  $("#paid").textContent=fmt(work(d));
  $("#start").disabled=!!d;
  $("#end").disabled=!d;

  $("#today").innerHTML=d
    ?["start","onsite","complete","stop","resume","lunch","end"]
      .map(k=>row(d,k)).join("")
    :"<span style='color:#667085'>No active day. Press Start Day to begin.</span>";

  document.querySelectorAll("[data-lunch]").forEach(b=>{
    b.classList.toggle("active",d?.lunch?.minutes==b.dataset.lunch);
  });

  document.querySelectorAll("[data-show]").forEach(x=>{
    x.classList.toggle("hide",!db.settings[x.dataset.show]);
  });

  $("#toggles").innerHTML=Object.keys(db.settings).map(k=>`
    <label class="setting">
      ${k==="complete"?"Job Complete":k[0].toUpperCase()+k.slice(1)}
      <input type="checkbox"
        ${db.settings[k]?"checked":""}
        onchange="toggle('${k}',this.checked)">
    </label>
  `).join("");

  $("#history").innerHTML=db.days.length
    ?db.days.map((d,i)=>`
      <div class="historyDay">
        <div class="historyHead">
          <button onclick="document.getElementById('d${i}').classList.toggle('open')">
            ${stamp(d.start.time)} — ${d.end?"Paid "+fmt(work(d)):"In progress"}
          </button>
          <button class="small" onclick="copy('${encodeURIComponent(text(d))}')">Copy</button>
        </div>
        <div class="details" id="d${i}">${text(d)}</div>
      </div>
    `).join("")
    :"<span style='color:#667085'>Completed days appear here.</span>";
}

function toggle(k,v){
  db.settings[k]=v;
  save();
  render();
}

function menu(){
  $("#settings").classList.toggle("hide");
}

function copy(s){
  navigator.clipboard.writeText(decodeURIComponent(s));
  alert("Copied.");
}

function copyAll(){
  copy(
    encodeURIComponent(
      db.days.slice().reverse().map(text).join("\n\n")
    )
  );
}

render();

setInterval(()=>{
  let d=active();

  if(d){
    $("#paid").textContent=fmt(work(d));

    let m=elapsed(d);
    $("#timer").textContent=
      "Timer "+fmt(m)+":"+
      String(Math.floor((m%1)*60)).padStart(2,"0");
  }
},1000);
</script>
</body>
</html>
