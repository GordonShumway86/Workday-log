<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workday Log">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="theme-color" content="#0a0e1a">
<title>Workday Log</title>
<style>
:root{
  --ink:#f2f4f7;
  --ink-soft:#c7ccd3;
  --muted:#8a8f99;
  --faint:#5b6068;
  --bg:#0a0e1a;
  --card:#131829;
  --card-alt:#3a3f46;
  --card-alt-light:#4c525a;
  --line:rgba(255,255,255,.08);
  --outline:rgba(255,255,255,.18);
  --brand:#6f9ec9;
  --navy-top:#4d6f95;
  --navy-bottom:#28405c;
  --maroon-top:#8a4030;
  --maroon-bottom:#4a2015;
  --gold:#cf9a34;
  --gold-light:#e8bd66;
  --gold-text:#241a08;
  --copper:#e2724a;
  --gauge-s-l:#eef0f3;
  --gauge-s-m:#9aa1ab;
  --gauge-s-d:#565c66;
  --gauge-green:#33b37a;
  --gauge-red:#e5522b;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 8px 22px rgba(0,0,0,.55);
  --shadow-sm:0 3px 9px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:auto;padding:18px 16px 48px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{color:var(--brand);flex-shrink:0}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.01em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin:0 0 10px 2px}

.card{background:var(--card);border:1px solid var(--outline);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow)}

button{border:1px solid var(--outline);border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--card-alt-light),var(--card-alt));color:var(--ink-soft);padding:13px 10px;font-weight:700;font-size:14.5px;min-height:46px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.08);transition:transform .08s ease, box-shadow .08s ease}
button:active{transform:scale(.97);box-shadow:none}
button:disabled{opacity:.4}
.primary{background:linear-gradient(180deg,var(--navy-top),var(--navy-bottom));color:#fff}
.end{background:linear-gradient(180deg,var(--maroon-top),var(--maroon-bottom));color:#fff}
.small{min-height:36px;padding:8px 10px;font-size:12.5px;box-shadow:none;background:var(--card-alt)}
.active{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--gold-text);box-shadow:none;font-weight:800}

.menuBtn{background:var(--card);color:var(--ink-soft);border:1px solid var(--outline);box-shadow:none;padding:9px 12px;font-size:12.5px;min-height:38px}

.clock{text-align:center;padding-top:18px}
.timer{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.gauge{position:relative;width:172px;height:172px;margin:14px auto 2px;border-radius:50%;padding:11px;box-shadow:var(--shadow);background:conic-gradient(from -90deg,
    var(--gauge-s-l) 0deg 35deg, var(--gauge-s-d) 35deg 70deg, var(--gauge-s-m) 70deg 110deg,
    var(--gauge-s-l) 110deg 150deg, var(--gauge-s-d) 150deg 190deg,
    var(--gauge-green) 195deg 250deg, var(--gauge-red) 250deg 340deg,
    var(--gauge-s-l) 345deg 360deg);display:flex}
.ticks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ticks line{stroke:rgba(0,0,0,.32)}
.gaugeInner{flex:1;border-radius:50%;background:radial-gradient(circle at 50% 35%, #202329, #101216 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);gap:1px}
.paid{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.caption{font-size:10.5px;color:var(--muted);letter-spacing:.09em;font-weight:700;margin-top:2px}

.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.lunch{margin-top:16px}
.lunch label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.lunchRow{display:flex;gap:7px}
.lunchRow button{flex:1}

.event{border-top:1px solid var(--line);padding:11px 0}
.event:first-child{border-top:0;padding-top:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name{font-weight:600;width:104px;flex-shrink:0;color:var(--ink-soft);font-size:14px}
.time{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.time.ded{color:var(--copper)}
.note{width:13ch;height:34px;line-height:18px;resize:none;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:5px 7px;font:14px inherit;flex-shrink:0;background:var(--card-alt);color:var(--ink)}
.note:focus{outline:2px solid var(--brand);outline-offset:1px}
.note.expanded{position:fixed;left:16px;right:16px;top:18%;height:52vh;width:auto;z-index:60;font-size:16px;line-height:1.4;box-shadow:0 20px 50px rgba(0,0,0,.6);background:var(--card)}
#noteBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:55}
#noteBackdrop.show{display:block}

.hide{display:none!important}

.setting{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.setting:first-child{border-top:0}
input[type=checkbox]{accent-color:var(--brand);width:19px;height:19px}

.historyDay{border-top:1px solid var(--line);padding:12px 0}
.historyDay:first-child{border-top:0}
.historyHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.historyHead button:first-child{background:none;border:0;color:var(--ink);padding:2px;text-align:left;flex:1;min-width:140px;box-shadow:none;font-size:14.5px;font-weight:700;justify-content:flex-start}
.details{display:none;margin-top:10px}
.details.open{display:block}
.summary{border-top:1px solid var(--line);padding:10px 0;font-weight:700;font-size:14.5px}

.offline{display:none;text-align:center;font-size:12.5px;color:#e8c273;background:rgba(201,150,45,.12);border:1px solid rgba(201,150,45,.4);border-radius:10px;padding:9px;margin-top:12px;font-weight:600}
.offline.show{display:block}

.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:20px;letter-spacing:.03em}

@media(max-width:380px){.name{width:88px}.gauge{width:154px;height:154px}.paid{font-size:33px}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
</style>
</head>

<script>
const K="workday-log-v2";

const labels={
  start:"Start Day",
  onsite:"Onsite",
  complete:"Job Complete",
  stop:"Unschd Stop",
  resume:"BOTR",
  lunch:"DTW/L/DTH",
  end:"End Day"
};

let db=JSON.parse(
  localStorage.getItem(K) ||
  '{"days":[],"settings":{"onsite":true,"complete":true,"stop":true,"resume":true,"lunch":true,"deductInstant":false,"showNotesInHistory":false}}'
);

const $=x=>document.querySelector(x);
const save=()=>localStorage.setItem(K,JSON.stringify(db));
const now=()=>new Date().toISOString();
const active=()=>db.days.find(x=>!x.end);
const mostRecent=()=>db.days[0];

/* ---- migrate old single-slot day records to the new event-log format ---- */
function migrate(){
  let changed=false;

  db.days.forEach(d=>{
    if(!d.events){
      d.events=[];
      ["onsite","complete","stop","resume"].forEach(k=>{
        if(d[k]){
          d.events.push({type:k,time:d[k].time,note:d[k].note||""});
          delete d[k];
        }
      });
      d.events.sort((a,b)=>new Date(a.time)-new Date(b.time));
      changed=true;
    }
  });

  const defaults={onsite:true,complete:true,stop:true,resume:true,lunch:true,deductInstant:false,showNotesInHistory:false};
  db.settings=Object.assign({},defaults,db.settings||{});

  // one-time fix: earlier versions saved deductInstant as true by default.
  // Force it to deferred once, then leave it alone so the Menu toggle works normally after this.
  if(!db.settings.__deferredFix){
    db.settings.deductInstant=false;
    db.settings.__deferredFix=true;
    changed=true;
  }

  if(changed)save();
}
migrate();

/* ---- formatting ---- */
const fmt=n=>{
  return String(Math.floor(n/60)).padStart(2,"0")+":"+
    String(Math.floor(n%60)).padStart(2,"0");
};

const dur=mins=>{
  mins=Math.max(0,Math.round(mins));
  let h=Math.floor(mins/60), m=mins%60;
  return h+" h "+String(m).padStart(2,"0")+" m";
};

const dateStr=x=>{
  let d=new Date(x);
  return String(d.getMonth()+1).padStart(2,"0")+"/"+
    String(d.getDate()).padStart(2,"0")+"/"+
    String(d.getFullYear()).slice(-2);
};

const clock=x=>{
  let d=new Date(x);
  let h=d.getHours()%12; if(h===0)h=12;
  return h+":"+String(d.getMinutes()).padStart(2,"0")+(d.getHours()<12?"am":"pm");
};

/* ---- time math ---- */
function totalSpan(d){
  let finish=new Date(d.end?.time||now());
  return Math.max(0,(finish-new Date(d.start.time))/60000);
}

function stopMinutes(d){
  let total=0;
  let finish=new Date(d.end?.time||now());
  let evs=d.events||[];
  let used=new Set();

  evs.forEach((e,i)=>{
    if(e.type!=="stop")return;
    let j=evs.findIndex((x,idx)=>idx>i&&x.type==="resume"&&!used.has(idx));
    let out=new Date(e.time);
    let back=j>-1?new Date(evs[j].time):finish;
    if(j>-1)used.add(j);
    total+=Math.max(0,(back-out)/60000);
  });

  return total;
}

function lunchMinutes(d){
  if(!d.lunch)return 0;
  if(db.settings.deductInstant)return d.lunch.minutes;
  return d.end?d.lunch.minutes:0;
}

function work(d){
  if(!d)return 0;
  return Math.max(0,totalSpan(d)-stopMinutes(d)-lunchMinutes(d));
}

function elapsed(d){
  if(!d)return 0;
  let m=(new Date()-new Date(d.start.time))/60000;
  let evs=d.events||[];
  let lastStopIdx=-1;
  evs.forEach((e,i)=>{if(e.type==="stop")lastStopIdx=i;});
  let hasOpenStop=lastStopIdx>-1&&!evs.slice(lastStopIdx+1).some(e=>e.type==="resume");
  if(hasOpenStop)m-=(new Date()-new Date(evs[lastStopIdx].time))/60000;
  return Math.max(0,m);
}

/* ---- timeline: merges a day's start/events/lunch/end into one ordered list ---- */
function timeline(d){
  const items=[];
  const evs=d.events||[];
  const used=new Set();

  items.push({ref:"start",label:labels.start,text:clock(d.start.time),note:d.start.note,sort:+new Date(d.start.time),ded:false});

  evs.forEach((e,i)=>{
    if(e.type==="resume"&&used.has(i))return;

    if(e.type==="stop"){
      let j=evs.findIndex((x,idx)=>idx>i&&x.type==="resume"&&!used.has(idx));
      if(j>-1){
        used.add(j);
        let mins=(new Date(evs[j].time)-new Date(e.time))/60000;
        items.push({ref:i,label:labels.stop,text:clock(e.time)+" to "+clock(evs[j].time)+" = "+dur(mins),note:e.note,sort:+new Date(e.time),ded:true});
      }else{
        items.push({ref:i,label:labels.stop,text:clock(e.time)+" to —",note:e.note,sort:+new Date(e.time),ded:true});
      }
    }else if(e.type==="resume"){
      items.push({ref:i,label:labels.resume,text:clock(e.time),note:e.note,sort:+new Date(e.time),ded:false});
    }else{
      items.push({ref:i,label:labels[e.type],text:clock(e.time),note:e.note,sort:+new Date(e.time),ded:false});
    }
  });

  if(d.lunch){
    items.push({ref:"lunch",label:labels.lunch,text:d.lunch.minutes+" m",note:d.lunch.note,sort:+new Date(d.lunch.time),ded:true});
  }

  items.sort((a,b)=>a.sort-b.sort);

  if(d.end){
    items.push({ref:"end",label:labels.end,text:clock(d.end.time),note:d.end.note,sort:+new Date(d.end.time),ded:false});
  }

  return items;
}

function updateNote(dayIndex,ref,value){
  const d=db.days[dayIndex];
  if(!d)return;
  if(ref==="start")d.start.note=value;
  else if(ref==="end"){if(d.end)d.end.note=value;}
  else if(ref==="lunch"){if(d.lunch)d.lunch.note=value;}
  else{const i=Number(ref);if(d.events[i])d.events[i].note=value;}
  save();
}

function itemRowHTML(it,dayIndex,showNotes){
  const cls=it.ded?" ded":"";
  const note=showNotes
    ?`<textarea class="note" placeholder="note"
        oninput="updateNote(${dayIndex},'${it.ref}',this.value)"
        onfocus="this.classList.add('expanded');$('#noteBackdrop').classList.add('show')"
        onblur="this.classList.remove('expanded');$('#noteBackdrop').classList.remove('show')">${it.note||""}</textarea>`
    :"";
  return `
    <div class="event">
      <div class="row">
        <span class="name">${it.label}</span>
        <span class="time${cls}">${it.text}</span>
        ${note}
      </div>
    </div>
  `;
}

/* ---- actions ---- */
function start(){
  if(active())return;
  db.days.unshift({start:{time:now(),note:""},events:[]});
  save();
  render();
}

function press(k){
  let d=active();
  if(!d){alert("Press Start Day first.");return;}

  if(k==="end"){
    d.end={time:now(),note:d.end?.note||""};
    save();render();
    return;
  }

  if(d.lastEvent===k&&!confirm(labels[k]+" was just pressed. Press it again?"))return;

  d.events.push({type:k,time:now(),note:""});
  d.lastEvent=k;
  save();
  render();
}

function lunch(n){
  let d=active();
  if(!d){alert("Press Start Day first.");return;}

  d.lunch={time:now(),minutes:n,note:d.lunch?.note||""};
  d.lastEvent="lunch";
  save();
  render();
}

function toggle(k,v){
  db.settings[k]=v;
  save();
  render();
}

function menu(){
  $("#settings").classList.toggle("hide");
}

function copy(s){
  navigator.clipboard.writeText(decodeURIComponent(s));
  alert("Copied.");
}

function dayText(d,withNotes){
  const items=timeline(d);
  const lines=items.map(it=>{
    let line=it.label+" "+it.text;
    if(withNotes&&it.note)line+=" — "+it.note;
    return line;
  });
  lines.push("Total  "+dur(totalSpan(d)));
  lines.push("Total Paid  "+dur(work(d)));
  return dateStr(d.start.time)+"\n"+lines.join("\n");
}

function copyDay(i,withNotes){
  const d=db.days[i];
  if(!d)return;
  copy(encodeURIComponent(dayText(d,withNotes)));
}

function copyAll(withNotes){
  copy(encodeURIComponent(
    db.days.slice().reverse().map(d=>dayText(d,withNotes)).join("\n\n")
  ));
}

/* ---- render ---- */
function renderToday(){
  const d=active();
  const idx=d?db.days.indexOf(d):-1;

  $("#today").innerHTML=d
    ?timeline(d).map(it=>itemRowHTML(it,idx,true)).join("")
    :"<span style='color:#667085'>No active day. Press Start Day to begin.</span>";
}

function historyDetailHTML(d,i){
  const rows=timeline(d).map(it=>itemRowHTML(it,i,db.settings.showNotesInHistory)).join("");
  const summary=`
    <div class="summary">Total &nbsp; ${dur(totalSpan(d))}</div>
    <div class="summary">Total Paid &nbsp; ${dur(work(d))}</div>
  `;
  return rows+summary;
}

function renderHistory(){
  $("#history").innerHTML=db.days.length
    ?db.days.map((d,i)=>`
      <div class="historyDay">
        <div class="historyHead">
          <button onclick="document.getElementById('d${i}').classList.toggle('open')">
            ${dateStr(d.start.time)} — ${d.end?"Paid "+fmt(work(d)):"In progress"}
          </button>
          <button class="small" onclick="copyDay(${i},false)">Copy</button>
          <button class="small" onclick="copyDay(${i},true)">Copy w/ Notes</button>
        </div>
        <div class="details" id="d${i}">${historyDetailHTML(d,i)}</div>
      </div>
    `).join("")
    :"<span style='color:#667085'>Completed days appear here.</span>";
}

function render(){
  let d=active();
  let display=d||mostRecent();

  $("#paid").textContent=display?fmt(work(display)):"00:00";
  $("#start").disabled=!!d;
  $("#end").disabled=!d;

  renderToday();

  document.querySelectorAll("[data-lunch]").forEach(b=>{
    b.classList.toggle("active",d?.lunch?.minutes==b.dataset.lunch);
  });

  document.querySelectorAll("[data-show]").forEach(x=>{
    x.classList.toggle("hide",!db.settings[x.dataset.show]);
  });

  $("#toggles").innerHTML=["onsite","complete","stop","resume","lunch"].map(k=>`
    <label class="setting">
      ${labels[k]}
      <input type="checkbox"
        ${db.settings[k]?"checked":""}
        onchange="toggle('${k}',this.checked)">
    </label>
  `).join("");

  $("#options").innerHTML=`
    <label class="setting">
      Deduct DTW/L/DTH instantly
      <input type="checkbox" ${db.settings.deductInstant?"checked":""}
        onchange="toggle('deductInstant',this.checked)">
    </label>
    <label class="setting">
      Show notes in history
      <input type="checkbox" ${db.settings.showNotesInHistory?"checked":""}
        onchange="toggle('showNotesInHistory',this.checked)">
    </label>
  `;

  renderHistory();
}

render();

setInterval(()=>{
  let d=active();
  let display=d||mostRecent();

  if(!display){
    $("#paid").textContent="00:00";
    $("#timer").textContent="Timer 00:00:00";
    return;
  }

  $("#paid").textContent=fmt(work(display));

  if(d){
    let m=elapsed(d);
    $("#timer").textContent=
      "Timer "+fmt(m)+":"+
      String(Math.floor((m%1)*60)).padStart(2,"0");
  }else{
    $("#timer").textContent="Timer "+fmt(totalSpan(display))+":00";
  }
},1000);

/* ---- Offline support ---- */
// All data lives in localStorage, so button presses, notes, and totals
// already work with zero connection. sw.js caches this page itself so the
// app still opens from the home screen with no signal at all. There's no
// cloud backend in this app, so "resync" just means re-rendering from
// local storage the moment you're back online.

function trySync(){
  render();
}

function updateOfflineBanner(){
  $("#offlineBanner").classList.toggle("show",!navigator.onLine);
}

window.addEventListener("online",()=>{
  updateOfflineBanner();
  trySync();
});
window.addEventListener("offline",updateOfflineBanner);
updateOfflineBanner();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
